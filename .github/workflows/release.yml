name: Build & Release

# Builds the Windows executable on a Windows runner and publishes it to a
# GitHub Release. Triggered either by pushing a version tag (vX.Y.Z) or by a
# manual run that takes the release tag as an input.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python -m PyInstaller --onefile --noconsole --name Locazo --icon locazo.ico locazo.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locazo-exe
          path: dist/Locazo.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "Publishing release $TAG at ${GITHUB_SHA}"
          gh release create "$TAG" "dist/Locazo.exe" \
            --title "Locazo $TAG" \
            --target "${GITHUB_SHA}" \
            --generate-notes
